    <script>
    	var loadDeferredStyles = function() {
    	    var addStylesNode = document.getElementById("deferred-styles");
    	    var replacement = document.createElement("div");
    	    replacement.innerHTML = addStylesNode.textContent;
    	    document.body.appendChild(replacement)
    	    addStylesNode.parentElement.removeChild(addStylesNode);
    	};
    	var raf = window.requestAnimationFrame || window.mozRequestAnimationFrame ||
    	window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;
    	if (raf) raf(function() { window.setTimeout(loadDeferredStyles, 0); });
    	else window.addEventListener('load', loadDeferredStyles);

    	// Theme toggle
    	(function() {
    	    var root = document.documentElement;
    	    var toggle = document.getElementById('theme-toggle');
    	    var stored = localStorage.getItem('theme');
    	    if (stored) root.setAttribute('data-theme', stored);

    	    toggle.addEventListener('click', function() {
    	        var current = root.getAttribute('data-theme');
    	        var isDark = !current
    	            ? window.matchMedia('(prefers-color-scheme: light)').matches ? false : true
    	            : current === 'dark';
    	        var next = isDark ? 'light' : 'dark';
    	        root.setAttribute('data-theme', next);
    	        localStorage.setItem('theme', next);
    	    });
    	})();

    	// Random shape mask for avatar
    	(function() {
    	    var masks = [
    	        'circle(50% at 50% 50%)',
    	        'inset(0 0 0 0 round 12px)'
    	    ];
    	    var pick = masks[Math.floor(Math.random() * masks.length)];
    	    var avatar = document.getElementById('avatar-bg');
    	    if (avatar) {
    	        avatar.style.clipPath = pick;
    	        avatar.style.webkitClipPath = pick;
    	    }
    	})();

    	// Typewriter for name
    	(function() {
    	    var el = document.getElementById('name');
    	    var text = 'Nordanne Isahac';
    	    var i = 0;
    	    var cursor = document.createElement('span');
    	    cursor.className = 'typewriter-cursor';
    	    cursor.innerHTML = '&nbsp;';
    	    el.appendChild(cursor);

    	    function type() {
    	        if (i < text.length) {
    	            var span = document.createElement('span');
    	            span.className = 'char';
    	            span.textContent = text.charAt(i) === ' ' ? '\u00A0' : text.charAt(i);
    	            el.insertBefore(span, cursor);
    	            i++;
    	            setTimeout(type, 80 + Math.random() * 60);
    	        } else {
    	            setTimeout(function() { cursor.style.display = 'none'; }, 2000);
    	        }
    	    }
    	    setTimeout(type, 300);
    	})();

    	// Floating shapes background
    	(function() {
    	    var canvas = document.getElementById('wave-bg');
    	    var ctx = canvas.getContext('2d');
    	    var w, h;
    	    var shapes = [];
    	    var numShapes = 14;
    	    var types = ['square', 'circle', 'triangle'];
    	    var color = '247, 181, 65';
    	    var mouseX = -9999, mouseY = -9999;
    	    var avoidRadius = 120;
    	    var avoidStrength = 3;

    	    function resize() {
    	        w = canvas.width = window.innerWidth;
    	        h = canvas.height = window.innerHeight;
    	    }
    	    window.addEventListener('resize', resize);
    	    resize();

    	    document.addEventListener('mousemove', function(e) {
    	        mouseX = e.clientX;
    	        mouseY = e.clientY;
    	    });
    	    document.addEventListener('mouseleave', function() {
    	        mouseX = -9999;
    	        mouseY = -9999;
    	    });

    	    for (var i = 0; i < numShapes; i++) {
    	        shapes.push({
    	            type: types[Math.floor(Math.random() * types.length)],
    	            x: Math.random() * 1.2 - 0.1,
    	            y: Math.random() * 1.2 - 0.1,
    	            size: 10 + Math.random() * 80,
    	            speedX: (Math.random() - 0.5) * 0.3,
    	            speedY: (Math.random() - 0.5) * 0.2,
    	            rotation: Math.random() * Math.PI * 2,
    	            rotSpeed: (Math.random() - 0.5) * 0.008,
    	            opacity: 0.08 + Math.random() * 0.12
    	        });
    	    }

    	    function drawShape(s) {
    	        var cx = s.x * w;
    	        var cy = s.y * h;
    	        ctx.save();
    	        ctx.translate(cx, cy);
    	        ctx.rotate(s.rotation);
    	        ctx.strokeStyle = 'rgb(' + color + ')';
    	        ctx.lineWidth = 1.5;

    	        if (s.type === 'square') {
    	            var half = s.size / 2;
    	            ctx.strokeRect(-half, -half, s.size, s.size);
    	        } else if (s.type === 'circle') {
    	            ctx.beginPath();
    	            ctx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
    	            ctx.stroke();
    	        } else if (s.type === 'triangle') {
    	            var r = s.size / 2;
    	            ctx.beginPath();
    	            ctx.moveTo(0, -r);
    	            ctx.lineTo(r * Math.cos(Math.PI / 6), r * Math.sin(Math.PI / 6));
    	            ctx.lineTo(-r * Math.cos(Math.PI / 6), r * Math.sin(Math.PI / 6));
    	            ctx.closePath();
    	            ctx.stroke();
    	        }

    	        ctx.restore();
    	    }

    	    function draw() {
    	        ctx.clearRect(0, 0, w, h);
    	        for (var i = 0; i < shapes.length; i++) {
    	            var s = shapes[i];
    	            var cx = s.x * w;
    	            var cy = s.y * h;

    	            // Mouse avoidance
    	            var dx = cx - mouseX;
    	            var dy = cy - mouseY;
    	            var dist = Math.sqrt(dx * dx + dy * dy);
    	            if (dist < avoidRadius && dist > 0) {
    	                var force = (avoidRadius - dist) / avoidRadius * avoidStrength;
    	                s.x += (dx / dist) * force / w;
    	                s.y += (dy / dist) * force / h;
    	            }

    	            s.x += s.speedX / w;
    	            s.y += s.speedY / h;
    	            s.rotation += s.rotSpeed;

    	            if (s.x * w > w + 100) s.x = -100 / w;
    	            if (s.x * w < -100) s.x = (w + 100) / w;
    	            if (s.y * h > h + 100) s.y = -100 / h;
    	            if (s.y * h < -100) s.y = (h + 100) / h;

    	            drawShape(s);
    	        }
    	        requestAnimationFrame(draw);
    	    }
    	    draw();
    	})();
    </script>
